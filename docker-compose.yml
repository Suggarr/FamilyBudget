services:
  postgres:
    container_name: familybudget-postgres
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - familybudget_postgres_data:/var/lib/postgresql/data
    networks:
      - mynetwork 
    restart: always 

  ollama:
    container_name: familybudget-ollama
    image: ollama/ollama:latest
    gpus: all
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:?OLLAMA_MODEL must be set}
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-12288}"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & server_pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$${OLLAMA_MODEL}\"; wait $$server_pid"]
    ports:
      - "11434:11434"
    volumes:
      - familybudget_ollama_data:/root/.ollama
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  mynetwork:
    driver: bridge

volumes:
  familybudget_postgres_data:
  familybudget_ollama_data:
